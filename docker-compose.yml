services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-setup:
    image: postgres:16
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      PGUSER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_READONLY_USER: ${POSTGRES_READONLY_USER:-economia_leitura}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:?Defina POSTGRES_READONLY_PASSWORD no arquivo .env}
    volumes:
      - ./sql/03_create_readonly_role.sh:/setup/03_create_readonly_role.sh:ro
    entrypoint:
      - bash
      - -c
      - "sed 's/\\r$//' /setup/03_create_readonly_role.sh | bash"
    depends_on:
      postgres:
        condition: service_healthy

  pipeline:
    build: .
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SERIES_CODES: ${SERIES_CODES:-432,11,433,1}
      DATA_INICIAL: ${DATA_INICIAL:-01/01/2020}
    depends_on:
      db-setup:
        condition: service_completed_successfully

volumes:
  postgres_data: